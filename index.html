<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre Google -->
    <title>
      KONAN SHOPPING CAMEROUN | Boutique en ligne fiable
    </title>

    <!-- Description SEO -->
    <meta
      name="description"
      content="Konan Shopping Cameroun est votre boutique en ligne de confiance. Achetez des vêtements, chaussures, téléphones, accessoires, électroménager et bien plus avec une livraison rapide partout au Cameroun."
    />

    <!-- Mots-clés -->
    <meta
      name="keywords"
      content="Konan Shopping, Cameroun, boutique en ligne, Yaoundé, Douala, vêtements, chaussures, téléphones, électronique, livraison Cameroun, achat en ligne"
    />

    <meta name="author" content="Konan Shopping Cameroun" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0F4CFF" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://konanshopping.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KONAN SHOPPING CAMEROUN" />
    <meta
      property="og:description"
      content="Votre boutique en ligne fiable au Cameroun. Livraison rapide et paiement sécurisé."
    />
    <meta property="og:image" content="https://konanshopping.com/logo.jpg" />
    <meta property="og:url" content="https://konanshopping.com/" />
    <meta property="og:site_name" content="Konan Shopping Cameroun" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KONAN SHOPPING CAMEROUN" />
    <meta
      name="twitter:description"
      content="Découvrez des milliers de produits avec une livraison rapide partout au Cameroun."
    />
    <meta name="twitter:image" content="https://konanshopping.com/logo.jpg" />

    <!-- Google -->
    <meta name="googlebot" content="index, follow" />

    <!-- Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Konan Shopping Cameroun",
        "url": "https://konanshopping.com",
        "logo": "https://konanshopping.com/logo.jpg",
        "image": "https://konanshopping.com/logo.jpg",
        "description": "Boutique en ligne fiable au Cameroun.",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "CM"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script src="https://fr.monetbil.com/widget/v2/monetbil.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </body>
</html>
